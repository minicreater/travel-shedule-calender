<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Planner</title>
<style>
  :root {
    --bg: #0F1117;
    --surface: #1A1D27;
    --card: #22263A;
    --border: #2E3350;
    --primary: #E8A830;
    --primary-dim: rgba(232,168,48,0.13);
    --text: #F0F2FF;
    --muted: #6B7099;
    --dim: #3A3F60;
    --red: #E85050;
    --green: #38C98A;
    --blue: #4A9EE8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Helvetica Neue','Hiragino Sans','BIZ UDPGothic',sans-serif;
    height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 4px; }

  /* ── Password ── */
  #pw-screen {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg); display: flex; align-items: center; justify-content: center;
  }
  #pw-screen.hidden { display: none; }
  .pw-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 40px 32px;
    width: 90%; max-width: 360px; text-align: center;
  }
  .pw-icon { font-size: 36px; margin-bottom: 16px; }
  .pw-label { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--primary); margin-bottom: 6px; }
  .pw-title { font-size: 18px; font-weight: 800; margin-bottom: 24px; }
  .pw-input {
    width: 100%; padding: 12px 16px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 16px;
    text-align: center; letter-spacing: .2em;
    outline: none; font-family: inherit; margin-bottom: 12px;
    transition: border-color .2s;
  }
  .pw-input:focus { border-color: var(--primary); }
  .pw-btn {
    width: 100%; padding: 13px;
    background: var(--primary); color: #000;
    border: none; border-radius: 10px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    letter-spacing: .04em; font-family: inherit;
  }
  .pw-error { font-size: 12px; color: var(--red); margin-top: 10px; min-height: 18px; }

  /* ── Loading ── */
  #loading-screen {
    position: fixed; inset: 0; z-index: 9000; background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
  }
  #loading-screen.hidden { display: none; }
  .loading-icon { font-size: 36px; animation: spin 2s linear infinite; }
  .loading-text { font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Setup Screen ── */
  #setup-screen {
    position: fixed; inset: 0; z-index: 8000; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #setup-screen.hidden { display: none; }
  .setup-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 32px 24px;
    width: 100%; max-width: 420px;
  }
  .setup-icon { font-size: 32px; margin-bottom: 12px; text-align: center; }
  .setup-title { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--primary); margin-bottom: 6px; text-align: center; }
  .setup-sub { font-size: 18px; font-weight: 800; margin-bottom: 24px; text-align: center; }
  .setup-label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; margin-bottom: 8px; }
  .setup-input {
    width: 100%; padding: 11px 14px; margin-bottom: 18px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 15px;
    outline: none; font-family: inherit; transition: border-color .2s;
  }
  .setup-input:focus { border-color: var(--primary); }
  .days-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .days-val { font-size: 28px; font-weight: 800; color: var(--primary); min-width: 36px; text-align: center; }
  .days-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 20px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-family: inherit; transition: all .15s;
  }
  .days-btn:hover { border-color: var(--primary); color: var(--primary); }
  .setup-hint { font-size: 12px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
  .setup-go {
    width: 100%; padding: 13px; border-radius: 10px; border: none;
    background: var(--primary); color: #000;
    font-size: 14px; font-weight: 700; cursor: pointer;
    letter-spacing: .04em; font-family: inherit;
  }
  .setup-go:disabled { background: var(--dim); color: var(--muted); cursor: default; }

  /* ── App ── */
  #app { display: flex; flex-direction: column; height: 100dvh; }
  #app.hidden { display: none; }

  /* Header */
  .header {
    padding: 14px 16px 12px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .header-left { flex: 1; min-width: 0; }
  .header-label { font-size: 10px; color: var(--primary); font-weight: 700; letter-spacing: .12em; margin-bottom: 2px; }
  .header-title { font-size: 18px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); flex-shrink: 0; }
  .sync-dot.offline { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .btn-primary {
    padding: 8px 14px; border-radius: 10px; border: none;
    background: var(--primary); color: #000;
    font-size: 13px; font-weight: 700; cursor: pointer;
    letter-spacing: .04em; font-family: inherit; white-space: nowrap;
  }
  .btn-settings {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-settings:hover { border-color: var(--primary); color: var(--primary); }

  /* Tabs */
  .tabs { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .tab-btn {
    flex: 1; padding: 8px 0; border: none;
    background: transparent; color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer;
    letter-spacing: .04em; transition: all .15s; font-family: inherit;
  }
  .tab-btn:not(:last-child) { border-right: 1px solid var(--border); }
  .tab-btn.active { background: var(--primary-dim); color: var(--primary); }

  /* Panels */
  .panel { flex: 1; overflow-y: auto; padding: 14px 14px 80px; display: none; }
  .panel.active { display: block; }

  /* Item Card */
  .item-card {
    background: var(--card); border-radius: 12px;
    border: 1px solid var(--border);
    padding: 12px 14px; margin-bottom: 8px;
    animation: fadeIn .22s ease;
  }
  .card-inner { display: flex; align-items: flex-start; gap: 10px; }
  .cat-icon {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-tags { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; flex-wrap: wrap; }
  .tag { font-size: 10px; font-weight: 700; border-radius: 4px; padding: 2px 7px; letter-spacing: .05em; }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .card-detail { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .card-link {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 6px; font-size: 12px; color: var(--blue);
    text-decoration: none; font-weight: 600;
  }
  .card-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .card-btn {
    width: 28px; height: 28px; border-radius: 6px;
    border: 1px solid var(--border); background: transparent;
    cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; transition: background .15s;
  }
  .card-btn:hover { background: var(--dim); }

  /* Empty */
  .empty { text-align: center; padding-top: 60px; color: var(--muted); font-size: 14px; }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }

  /* Day block */
  .day-block { margin-bottom: 24px; }
  .day-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .day-badge {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    background: var(--primary-dim); border: 1px solid rgba(232,168,48,.27);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .day-badge-label { font-size: 8px; color: var(--primary); font-weight: 700; letter-spacing: .1em; }
  .day-badge-num { font-size: 18px; color: var(--primary); font-weight: 800; line-height: 1; }
  .day-line { flex: 1; height: 1px; background: var(--border); }
  .day-count { font-size: 11px; color: var(--muted); }
  .day-empty {
    padding: 14px; border-radius: 10px; text-align: center;
    border: 1px dashed var(--border); color: var(--muted); font-size: 13px;
  }

  /* FAB */
  .fab {
    position: fixed; bottom: 24px; right: 20px;
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: var(--primary); color: #000; font-size: 24px;
    cursor: pointer; box-shadow: 0 4px 20px rgba(232,168,48,.35);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    transition: transform .15s;
  }
  .fab:hover { transform: scale(1.08); }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    width: 100%; max-width: 560px;
    background: var(--surface); border-radius: 20px 20px 0 0;
    padding: 20px 18px 32px; border: 1px solid var(--border);
    animation: slideUp .28s cubic-bezier(.34,1.4,.64,1);
    max-height: 92dvh; overflow-y: auto;
  }
  .modal-handle { width: 40px; height: 4px; background: var(--dim); border-radius: 4px; margin: 0 auto 16px; }
  .modal-title { font-size: 15px; font-weight: 700; letter-spacing: .04em; margin-bottom: 14px; }
  .form-label { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .06em; margin-bottom: 6px; }
  .form-row { margin-bottom: 12px; }

  /* Cat pills */
  .cat-pills { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px; }
  .cat-pill {
    flex-shrink: 0; padding: 5px 11px; border-radius: 6px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    letter-spacing: .03em; transition: all .15s;
    font-family: inherit; border: 1px solid var(--border);
    background: transparent; color: var(--muted);
  }

  /* Day picker in modal */
  .day-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .day-pick {
    flex-shrink: 0; min-width: 44px; height: 38px; border-radius: 8px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: all .15s; padding: 0 8px;
  }
  .day-pick.active { border-color: var(--primary); background: var(--primary-dim); color: var(--primary); }

  /* Time picker */
  .time-picker-wrap { display: flex; gap: 6px; align-items: center; }
  .time-scroll-col {
    flex: 1; height: 120px; overflow-y: scroll;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); scroll-snap-type: y mandatory;
    scrollbar-width: none;
  }
  .time-scroll-col::-webkit-scrollbar { display: none; }
  .time-item {
    height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: var(--muted);
    cursor: pointer; scroll-snap-align: center; transition: color .1s;
    user-select: none;
  }
  .time-item.selected { color: var(--primary); background: var(--primary-dim); }
  .time-item.pad { opacity: 0; pointer-events: none; }
  .time-sep { font-size: 20px; font-weight: 700; color: var(--muted); padding-bottom: 0; }
  .time-clear {
    padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 12px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .time-display { font-size: 13px; color: var(--primary); font-weight: 700; text-align: center; margin-top: 4px; min-height: 18px; }

  /* Text inputs */
  .input, .textarea {
    width: 100%; padding: 10px 14px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px;
    outline: none; font-family: inherit; display: block;
    transition: border-color .2s;
  }
  .input:focus, .textarea:focus { border-color: var(--primary); }
  .textarea { resize: none; }

  /* Modal actions */
  .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn-cancel {
    flex: 1; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .btn-save {
    flex: 2; padding: 12px; border-radius: 10px; border: none;
    background: var(--primary); color: #000;
    font-size: 14px; font-weight: 700; cursor: pointer;
    letter-spacing: .03em; font-family: inherit;
  }
  .btn-save:disabled { background: var(--dim); color: var(--muted); cursor: default; }

  /* ── Settings Modal ── */
  #settings-overlay {
    position: fixed; inset: 0; z-index: 1100;
    background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center;
  }
  #settings-overlay.hidden { display: none; }
  .settings-box {
    width: 100%; max-width: 480px; background: var(--surface);
    border-radius: 20px 20px 0 0; padding: 20px 18px 32px;
    border: 1px solid var(--border);
    animation: slideUp .28s cubic-bezier(.34,1.4,.64,1);
    max-height: 80dvh; overflow-y: auto;
  }
  .settings-title { font-size: 15px; font-weight: 700; margin-bottom: 20px; }
  .settings-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .settings-days-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .day-tag {
    display: flex; align-items: center; gap: 4px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px;
    font-size: 13px; font-weight: 600;
  }
  .day-tag-del {
    background: none; border: none; color: var(--red);
    cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px;
  }
  .btn-add-day {
    padding: 7px 14px; border-radius: 8px;
    border: 1px dashed var(--primary); background: transparent;
    color: var(--primary); font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .settings-input {
    flex: 1; padding: 9px 14px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px;
    outline: none; font-family: inherit;
  }
  .settings-input:focus { border-color: var(--primary); }
  .btn-settings-save {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: var(--primary); color: #000;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    margin-top: 6px;
  }

  /* Confirm */
  #confirm-overlay {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
  }
  #confirm-overlay.hidden { display: none; }
  .confirm-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px 24px; width: 90%; max-width: 320px; text-align: center;
  }
  .confirm-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .confirm-sub { font-size: 13px; color: var(--muted); margin-bottom: 22px; line-height: 1.5; }
  .confirm-actions { display: flex; gap: 10px; }
  .btn-confirm-cancel {
    flex: 1; padding: 11px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .btn-confirm-ok {
    flex: 1; padding: 11px; border-radius: 10px; border: none;
    background: var(--red); color: #fff;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
  }

  /* Toast */
  #toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; font-weight: 600;
    padding: 10px 20px; border-radius: 20px;
    opacity: 0; transition: opacity .3s;
    z-index: 3000; white-space: nowrap; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  input[type=date]{color-scheme:dark}
  #panel-calendar.active{display:flex;flex-direction:column;padding:0}
  .cal-top{padding:12px 16px 6px;flex-shrink:0}
  .cal-date{font-size:24px;font-weight:800}.cal-wd{font-size:13px;color:var(--muted);margin-top:2px}
  #cal-chips{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 8px;flex-shrink:0}
  #cal-un{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 16px;flex-shrink:0}
  #cal-un:not(:empty){padding-bottom:8px}
  .cal-un-l{font-size:11px;color:var(--muted);font-weight:700}
  .cal-un-i{font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:3px 8px;cursor:pointer}
  #cal-scroll{flex:1;overflow-y:auto;border-top:1px solid var(--border);padding-bottom:80px}
  #cal-grid{position:relative}
  .cal-line{position:absolute;left:52px;right:0;border-top:1px solid var(--border)}
  .cal-hl{position:absolute;left:0;width:44px;text-align:right;font-size:11px;color:var(--muted);font-weight:600}
  .cal-ev-wrap{position:absolute;left:56px;right:8px;top:0;bottom:0}
  .cal-ev{position:absolute;border-radius:6px;padding:3px 6px;font-size:11px;line-height:1.35;overflow:hidden;cursor:pointer}
  .cal-ev b{font-size:12px}
  .cal-now{position:absolute;left:52px;right:0;border-top:2px solid var(--red);pointer-events:none}
  .settings-days-list{flex-direction:column}.day-tag{width:100%}
  .date-in{margin-left:auto;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 6px;font-family:inherit}
  @keyframes slideUp { from{transform:translateY(60px);opacity:0} to{transform:translateY(0);opacity:1} }
  @keyframes fadeIn  { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  @keyframes shake   { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
</style>
</head>
<body>

<!-- Password -->
<div id="pw-screen">
  <div class="pw-box">
    <div class="pw-icon">🔐</div>
    <div class="pw-label">TRAVEL PLANNER</div>
    <div class="pw-title" id="pw-trip-title">旅行プランナー</div>
    <input id="pw-input" class="pw-input" type="password" placeholder="パスワードを入力" autocomplete="off"
      onkeydown="if(event.key==='Enter')checkPw()">
    <button class="pw-btn" onclick="checkPw()">アクセスする</button>
    <div class="pw-error" id="pw-error"></div>
  </div>
</div>

<!-- Loading -->
<div id="loading-screen" class="hidden">
  <div class="loading-icon">✈</div>
  <div class="loading-text">接続中...</div>
</div>

<!-- Setup (first time) -->
<div id="setup-screen" class="hidden">
  <div class="setup-box">
    <div class="setup-icon">✈</div>
    <div class="setup-title">TRAVEL PLANNER</div>
    <div class="setup-sub">旅行の設定をしよう</div>

    <div class="setup-label">旅行先・タイトル</div>
    <input id="setup-destination" class="setup-input" placeholder="例：台湾、パリ、バリ島..." maxlength="30">

    <div class="setup-label">出発日（任意）</div>
    <input id="setup-start" type="date" class="setup-input">

    <div class="setup-label">旅行日数</div>
    <div class="days-row">
      <button class="days-btn" onclick="changeDays(-1)">－</button>
      <div class="days-val" id="setup-days-val">3</div>
      <div style="font-size:14px;color:var(--muted)">泊</div>
      <div class="days-val" id="setup-nights-val">4</div>
      <div style="font-size:14px;color:var(--muted)">日</div>
      <button class="days-btn" onclick="changeDays(1)">＋</button>
    </div>
    <div class="setup-hint">※ あとからDay数は追加・削除できます</div>

    <button class="setup-go" id="setup-go-btn" onclick="doSetup()" disabled>プランニング開始 →</button>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <div class="header">
    <div class="header-top">
      <div class="header-left">
        <div class="header-label">TRAVEL PLANNER — SHARED</div>
        <div class="header-title" id="app-title">旅行プラン</div>
      </div>
      <div class="header-right">

// ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  return String(s||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function getCat(id) { return CATS.find(c=>c.id===id)||CATS[0]; }

function showToast(msg) {
  const el = document.getElementById("toast");

function setSync(online) {

// ── Time helpers ─────────────────────────────────────────────────────
function timeToMinutes(h, m) { return h * 60 + m; }
function formatTime(h, m) {
  if (h === null) return "";
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}
function parseTime(str) {
  if (!str) return { h: null, m: 0 };
  const m = str.match(/^(\d{1,2}):(\d{2})$/);
  if (m) return { h: parseInt(m[1]), m: parseInt(m[2]) };
  return { h: null, m: 0 };
}

// Sort items: by day, then by time (nulls last), then by createdAt
function sortItems(arr) {
  return [...arr].sort((a, b) => {
    if (a.day !== b.day) return a.day - b.day;
    const at = a.time ? parseTime(a.time) : null;
    const bt = b.time ? parseTime(b.time) : null;
    if (at && bt) return timeToMinutes(at.h, at.m) - timeToMinutes(bt.h, bt.m);
    if (at && !bt) return -1;
    if (!at && bt) return 1;
    return (a.createdAt||0) - (b.createdAt||0);
  });
}

// ── Firebase Init ─────────────────────────────────────────────────────
function initFirebase() {
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);
  itemsRef  = ref(db, "items");
  configRef = ref(db, "config");

  // Listen config
  onValue(configRef, snap => {
    const val = snap.val();
    if (!val) {
      // First launch: show setup
      document.getElementById("loading-screen").classList.add("hidden");
      document.getElementById("setup-screen").classList.remove("hidden");
    } else {
      config.title = val.title || "旅行プラン";
      config.days  = Array.isArray(val.days) ? val.days.sort((a,b)=>a-b) : [1,2,3];
      config.dates = val.dates || {};
      const tdk = Object.keys(config.dates).find(k=>config.dates[k]===toISO(new Date()));
      if (!config.days.includes(calDay)) calDay = tdk ? +tdk.slice(1) : config.days[0];
      document.getElementById("app-title").textContent = config.title;
      document.getElementById("pw-trip-title").textContent = config.title;
      buildTabs();
      buildDayScroll();
      buildSettingsDays();
      document.getElementById("setup-screen").classList.add("hidden");
      document.getElementById("loading-screen").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      render();
    }
  });

  // Listen items
  onValue(itemsRef, snap => {
    const val = snap.val();
    items = val
      ? Object.entries(val).map(([fbKey,data])=>({fbKey,...data}))
      : [];
    render();
  }, err => { setSync(false); console.error(err); });

  // Connection state
  onValue(ref(db, ".info/connected"), snap => setSync(!!snap.val()));
}

// ── Time Picker ───────────────────────────────────────────────────────
const HOURS = Array.from({length:24},(_,i)=>i);
const MINS  = [0,5,10,15,20,25,30,35,40,45,50,55];

function buildTimePicker() {
  buildTimeCol("time-hour", HOURS, selHour, v=>{
    selHour = v;
    updateTimeDisplay();
  }, h=>h===null?"--":String(h).padStart(2,"0"));

  buildTimeCol("time-min", MINS, selMin, v=>{
    selMin = v;
    updateTimeDisplay();
  }, m=>String(m).padStart(2,"0"));

  updateTimeDisplay();
}

function buildTimeCol(id, values, selected, onChange, fmt) {
  const el = document.getElementById(id);
  el.innerHTML =
    `<div class="time-item pad">　</div>` +
    values.map(v=>`<div class="time-item${v===selected?" selected":""}">${fmt(v)}</div>`).join("") +
    `<div class="time-item pad">　</div>`;
  const idx = values.indexOf(selected);
  el._lock = true;
  requestAnimationFrame(()=>{ el.scrollTop = Math.max(0,idx) * 40; setTimeout(()=>{el._lock=false},250); });
  let timer;
  el.onscroll = () => {
    clearTimeout(timer);
    timer = setTimeout(()=>{
      if (el._lock) return;
      const i = Math.max(0, Math.min(values.length-1, Math.round(el.scrollTop/40)));
      el.querySelectorAll(".time-item:not(.pad)").forEach((x,k)=>x.classList.toggle("selected",k===i));
      onChange(values[i]);
    }, 80);
  };
  el.onclick = e => {
    const items = [...el.children], i = items.indexOf(e.target.closest(".time-item"));
    if (i>0 && i<items.length-1) el.scrollTo({top:(i-1)*40,behavior:"smooth"});
  };
}

function updateTimeDisplay() {
  const el = document.getElementById("time-display");
  el.textContent = selHour !== null ? `選択中: ${formatTime(selHour, selMin)}` : "時間なし";
}

window.clearTime = function() {
  selHour = null;
  selMin  = 0;
  // Reset hour col to top visual (no hour selected)
  const hEl = document.getElementById("time-hour");
  hEl.querySelectorAll(".time-item:not(.pad)").forEach(el=>el.classList.remove("selected"));
  const mEl = document.getElementById("time-min");
  mEl.querySelectorAll(".time-item:not(.pad)").forEach((el,i)=>el.classList.toggle("selected",i===0));
  hEl._lock = true; hEl.scrollTop = 0; setTimeout(()=>{hEl._lock=false},300);
  updateTimeDisplay();
};

    createdAt: editingKey
      ? (items.find(i=>i.fbKey===editingKey)?.createdAt||Date.now())
      : Date.now(),
  };
  try {
    if (editingKey) {
      await update(ref(db, `items/${editingKey}`), form);
      showToast("✓ 更新しました");

      await push(itemsRef, form);
      showToast("✓ 追加しました");

window.openSettings = function() {
  document.getElementById("s-title").value = config.title;

  buildSettingsDays();
  document.getElementById("settings-overlay").classList.remove("hidden");

function buildSettingsDays() {
  const el = document.getElementById("settings-days-list");
  if (!el) return;
  el.innerHTML = tempDays.map(d=>`<div class="day-tag">Day ${d}
    <input type="date" class="date-in" value="${tempDates["d"+d]||""}" onchange="setTD(${d},this.value)">
    <button class="day-tag-del" onclick="removeDay(${d})">×</button></div>`).join("");
}
window.setTD = (d,v) => { tempDates["d"+d] = v; };
window.applyStart = function() {
  const st = document.getElementById("s-start").value;
  if (!st) return showToast("開始日を選んでください");
  tempDays.forEach((d,i)=>tempDates["d"+d]=addD(st,i));
  buildSettingsDays();
};
window.addDay = function() {
  const next = tempDays.length ? Math.max(...tempDays)+1 : 1;
  if (next > 30) return showToast("Day は最大30まで");
  tempDays.push(next);
  tempDates["d"+next] = addD(tempDates["d"+(next-1)]||"", 1);
  buildSettingsDays();
};
window.removeDay = function(d) {
  if (tempDays.length <= 1) return showToast("最低1日は必要です");
  tempDays = tempDays.filter(x=>x!==d);
  buildSettingsDays();
};
window.saveSettings = async function() {
  const title = document.getElementById("s-title").value.trim();
  if (!title) return showToast("タイトルを入力してください");
  const gone = items.filter(i=>!tempDays.includes(i.day));
  if (gone.length && !confirm(`削除するDayに予定が${gone.length}件あります。予定も削除しますか？`)) return;
  for (const i of gone) await remove(ref(db, `items/${i.fbKey}`));
  const dates = {};
  tempDays.forEach(d=>{ if (tempDates["d"+d]) dates["d"+d] = tempDates["d"+d]; });
  await set(configRef, { title, days: [...tempDays].sort((a,b)=>a-b), dates });
  showToast("✓ 設定を保存しました");
  closeSettings();
};

        <div class="card-title">${esc(item.title)}</div>
        ${item.detail?`<div class="card-detail">${esc(item.detail)}</div>`:""}
        ${item.link?`<a class="card-link" href="${esc(item.link)}" target="_blank" rel="noreferrer">🔗 ${linkLabel}</a>`:""}
      </div>
      <div class="card-actions">
        <button class="card-btn" style="color:var(--muted)" onclick="openModal('${item.fbKey}')">✎</button>
        <button class="card-btn" style="color:var(--red)"   onclick="deleteItem('${item.fbKey}')">✕</button>
      </div>
    </div>
  </div>`;
}

function render() {
  if (!config.days.length) return;
  const sorted = sortItems(items);

  // List tab count
  const countEl = document.getElementById("list-count");
  if (countEl) countEl.textContent = items.length;

  // List view (sorted by day+time)
  const lc = document.getElementById("list-container");
  const le = document.getElementById("list-empty");
  if (items.length === 0) { le.style.display="block"; lc.innerHTML=""; }
  else { le.style.display="none"; lc.innerHTML = sorted.map(renderCard).join(""); }

  // Schedule view
  document.getElementById("schedule-container").innerHTML = config.days.map(d=>{
    const dayItems = sorted.filter(i=>i.day===d);
    return `
    <div class="day-block">
      <div class="day-header">
        <div class="day-badge">
          <span class="day-badge-label">DAY</span>
          <span class="day-badge-num">${d}</span>
        </div>
        <span style="font-size:13px;font-weight:700">${fmtL(dd(d))}</span>
        <div class="day-line"></div>
        <span class="day-count">${dayItems.length}件</span>
      </div>
      ${dayItems.length===0
        ? `<div class="day-empty">予定なし</div>`
        : dayItems.map(renderCard).join("")}
    </div>`;
  }).join("");
  renderCalendar();
}

// ── Date / Calendar ───────────────────────────────────────────────────
const WD = ["日","月","火","水","木","金","土"];
const pISO = s => { const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||""); return m?new Date(+m[1],m[2]-1,+m[3]):null; };
const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addD = (s,n) => { const d=pISO(s); if(!d) return ""; d.setDate(d.getDate()+n); return toISO(d); };
const fmtL = s => { const d=pISO(s); return d?`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`:""; };
const fmtS = s => { const d=pISO(s); return d?`${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`:""; };
const dd = n => (config.dates||{})["d"+n] || "";
const endStr = it => { const t=parseTime(it.time); if(t.h===null) return ""; const e=Math.min(1439,t.h*60+t.m+(it.duration||60)); return formatTime(Math.floor(e/60),e%60); };

const DURS = [30,60,90,120,180,240];
function buildDur() {
  document.getElementById("dur-pills").innerHTML = DURS.map(m=>`<button class="day-pick${m===selDur?" active":""}" onclick="selDurF(${m})">${m<60?m+"分":m/60+"時間"}</button>`).join("");
}
window.selDurF = m => { selDur = m; buildDur(); };
window.selectCalDay = n => { calDay = n; renderCalendar(true); };

const HH = 56, TP = 10;
function renderCalendar(scroll) {
  if (!config.days.length) return;
  if (!config.days.includes(calDay)) calDay = config.days[0];
  const dt = dd(calDay), d = pISO(dt);
  document.getElementById("cal-chips").innerHTML = config.days.map(n=>`<button class="day-pick${n===calDay?" active":""}" onclick="selectCalDay(${n})">D${n}${dd(n)?`<br><span style="font-size:10px;font-weight:500">${fmtS(dd(n))}</span>`:""}</button>`).join("");
  document.getElementById("cal-head").innerHTML = d
    ? `<div class="cal-date">${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日</div><div class="cal-wd">${WD[d.getDay()]}曜日 · DAY ${calDay}</div>`
    : `<div class="cal-date">DAY ${calDay}</div><div class="cal-wd">日付未設定（⚙から設定できます）</div>`;
  const all = sortItems(items).filter(i=>i.day===calDay);
  const un = all.filter(i=>!i.time);
  document.getElementById("cal-un").innerHTML = un.length ? `<span class="cal-un-l">時間未定</span>`+un.map(i=>`<span class="cal-un-i" onclick="openModal('${i.fbKey}')">${esc(i.title)}</span>`).join("") : "";
  const evs = all.filter(i=>i.time).map(i=>{ const t=parseTime(i.time), s=t.h*60+t.m; return {i, s, e:Math.min(1440,s+(i.duration||60))}; });
  let cl=[], ce=0, cols=[]; const out=[];
  const flush = () => { cl.forEach(x=>x.n=cols.length); out.push(...cl); cl=[]; cols=[]; };
  evs.forEach(x=>{
    if (cl.length && x.s>=ce) flush();
    let c = cols.findIndex(v=>v<=x.s);
    if (c<0) { c=cols.length; cols.push(x.e); } else cols[c]=x.e;
    x.c=c; cl.push(x); ce=Math.max(ce,x.e);
  });
  flush();
  let h = "";
  for (let k=0;k<=24;k++) { const y=TP+k*HH; h+=`<div class="cal-line" style="top:${y}px"></div>`+(k<24?`<div class="cal-hl" style="top:${y-7}px">${k}:00</div>`:""); }
  h += `<div class="cal-ev-wrap">` + out.map(x=>{
    const c=getCat(x.i.category), top=TP+x.s*HH/60, ht=Math.max(22,(x.e-x.s)*HH/60-2);
    return `<div class="cal-ev" style="top:${top}px;height:${ht}px;left:${x.c/x.n*100}%;width:calc(${100/x.n}% - 3px);background:${c.color}2e;border-left:3px solid ${c.color};color:${c.color}" onclick="event.stopPropagation();openModal('${x.i.fbKey}')"><b>${esc(x.i.title)}</b><br>${x.i.time}–${endStr(x.i)}</div>`;
  }).join("") + `</div>`;
  if (dt === toISO(new Date())) { const n=new Date(); h+=`<div class="cal-now" style="top:${TP+(n.getHours()*60+n.getMinutes())*HH/60}px"></div>`; }
  const grid = document.getElementById("cal-grid");
  grid.style.height = (TP*2+24*HH)+"px";
  grid.innerHTML = h;
  grid.onclick = e => {
    const m = Math.max(0, Math.min(1425, Math.floor((e.clientY-grid.getBoundingClientRect().top-TP)/HH*4)*15));
    openModal(null, {day:calDay, min:m});
  };
  if (scroll) setTimeout(()=>{ document.getElementById("cal-scroll").scrollTop = Math.max(0, TP+((evs[0]?evs[0].s:480)-60)*HH/60); }, 0);
}

// ── Boot ──────────────────────────────────────────────────────────────
buildCatPills();

if (sessionStorage.getItem(SESSION_KEY)==="1") {
  document.getElementById("pw-screen").classList.add("hidden");
  document.getElementById("loading-screen").classList.remove("hidden");
  initFirebase();
}
</script>
